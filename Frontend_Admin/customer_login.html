<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập & Đăng ký Khách hàng</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card" style="max-width: 440px;">
            <div class="auth-header" style="border-bottom-color: var(--success);">
                <h2>CỔNG THÔNG TIN KHÁCH HÀNG</h2>
                <p>Đăng nhập hoặc đăng ký tài khoản khách hàng mới</p>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 18px; background: #f3f4f6; padding: 4px; border-radius: 4px;">
                <button class="btn" id="tabLoginBtn" onclick="switchAuthMode('login')">Đăng nhập</button>
                <button class="btn btn-warning" id="tabRegBtn" onclick="switchAuthMode('register')">Đăng ký tài khoản</button>
            </div>

            <!-- FORM ĐĂNG NHẬP -->
            <div id="loginBox">
                <div style="margin-bottom: 14px;">
                    <label for="lUser">Tên đăng nhập</label>
                    <input type="text" id="lUser" placeholder="Nhập username khách hàng">
                </div>
                <div style="margin-bottom: 18px;">
                    <label for="lPass">Mật khẩu</label>
                    <input type="password" id="lPass" value="123456">
                </div>
                <button class="btn btn-success" style="width: 100%; padding: 10px;" onclick="loginCustomer()">Đăng nhập</button>
            </div>

            <!-- FORM ĐĂNG KÝ -->
            <div id="registerBox" style="display: none;">
                <div class="grid-form" style="grid-template-columns: 1fr 1fr;">
                    <div>
                        <label>Tên đăng nhập</label>
                        <input type="text" id="rUser" placeholder="Username">
                    </div>
                    <div>
                        <label>Mật khẩu</label>
                        <input type="password" id="rPass" placeholder="Mật khẩu">
                    </div>
                </div>
                <div style="margin-bottom: 12px;">
                    <label>Họ và tên khách hàng</label>
                    <input type="text" id="rName" placeholder="Nhập họ và tên">
                </div>
                <div class="grid-form" style="grid-template-columns: 1fr 1fr;">
                    <div>
                        <label>Số điện thoại</label>
                        <input type="text" id="rPhone" placeholder="Số điện thoại">
                    </div>
                    <div>
                        <label>Độ tuổi</label>
                        <input type="number" id="rAge" value="21">
                    </div>
                </div>
                <div style="margin-bottom: 18px;">
                    <label>Sở thích tiêu dùng</label>
                    <select id="rInterest">
                        <option value="Gaming">Gaming</option>
                        <option value="Văn phòng">Văn phòng</option>
                        <option value="Đồ họa">Đồ họa</option>
                        <option value="Lập trình">Lập trình</option>
                    </select>
                </div>
                <button class="btn btn-success" style="width: 100%; padding: 10px;" onclick="registerCustomer()">Hoàn tất đăng ký</button>
            </div>

            <div style="margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border-color); text-align: center; font-size: 13px;">
                Nhân sự nội bộ: <a href="login.html">Đăng nhập Quản trị / CRM</a>
            </div>
        </div>
    </div>

    <script>
        const CUS_API = "http://localhost:5000/api/customer";

        window.onload = () => {
            const currentCus = JSON.parse(localStorage.getItem("currentCustomer") || "null");
            if (currentCus) window.location.href = "user.html";
        };

        function switchAuthMode(mode) {
            const isLogin = mode === 'login';
            document.getElementById("loginBox").style.display = isLogin ? "block" : "none";
            document.getElementById("registerBox").style.display = isLogin ? "none" : "block";
            document.getElementById("tabLoginBtn").className = isLogin ? "btn" : "btn btn-warning";
            document.getElementById("tabRegBtn").className = !isLogin ? "btn" : "btn btn-warning";
        }

        async function loginCustomer() {
            const username = document.getElementById("lUser").value.trim();
            const password = document.getElementById("lPass").value.trim();
            if (!username || !password) return alert("Vui lòng nhập tên đăng nhập và mật khẩu.");

            const res = await fetch(`${CUS_API}/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (!res.ok) return alert(data.message || "Đăng nhập thất bại.");

            localStorage.setItem("currentCustomer", JSON.stringify(data));
            window.location.href = "user.html";
        }

        async function registerCustomer() {
            const username = document.getElementById("rUser").value.trim();
            const password = document.getElementById("rPass").value.trim();
            const fullName = document.getElementById("rName").value.trim();

            if (!username || !password || !fullName) {
                return alert("Vui lòng nhập đầy đủ Tên đăng nhập, Mật khẩu và Họ tên.");
            }

            const body = {
                username,
                password,
                fullName,
                phone: document.getElementById("rPhone").value.trim(),
                age: Number(document.getElementById("rAge").value || 20),
                interest: document.getElementById("rInterest").value
            };

            const res = await fetch(`${CUS_API}/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (!res.ok) return alert(data.message || "Lỗi đăng ký.");

            alert("Đăng ký tài khoản thành công. Vui lòng đăng nhập.");
            document.getElementById("lUser").value = username;
            document.getElementById("lPass").value = password;
            switchAuthMode('login');
        }
    </script>
</body>
</html>
